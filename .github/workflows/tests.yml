name: Comprehensive Testing for POS Backend

on:
  push:
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Install Project Dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pos/requirements.txt ]; then pip install -r pos/requirements.txt; fi
        pip install pytest httpx pytest-asyncio anyio passlib bcrypt jwcrypto pyjwt

    - name: Run Complete Test Suite
      env:
        DATABASE_URL: sqlite:///./test.db
      run: |
        python -c "import sys; import types; sys.modules['pwd'] = types.ModuleType('pwd')"
        cd pos && python -c "import sys; import types; sys.modules['pwd'] = types.ModuleType('pwd'); import app.core.security" || true
        cd pos && pytest tests/ -v
